name: Frontend Build

on:
  push:
    branches:
      - "feat/**"
      - "integrate/**"
      - main
      - "fix/pj2608-0553-five-owner-first-principles-existing-modules-20261023"
      - "fix/pj2608-0553-urgent-thailand-cif-pricing-20261024"
  pull_request:
    branches:
      - main
      - "integrate/pj2608-0553-bda-bulk-tag-rebased-20261022"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  windows-0553:
    if: github.ref == 'refs/heads/fix/pj2608-0553-urgent-thailand-cif-pricing-20261024' || github.head_ref == 'fix/pj2608-0553-urgent-thailand-cif-pricing-20261024' || github.ref == 'refs/heads/fix/pj2608-0553-five-owner-first-principles-existing-modules-20261023' || github.head_ref == 'fix/pj2608-0553-five-owner-first-principles-existing-modules-20261023'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate existing spare owners
        run: npm run validate:0553-existing-spare-owners-2026
      - name: Full validation and production build
        run: npm run build
